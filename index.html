<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 1 Olympiad Master - 500 Fresh Questions Portal</title>
<style>
  :root {
    --math: #2563eb;
    --science: #16a34a;
    --english: #9333ea;
    --gk: #ea580c;
    --reasoning: #4f46e5;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #f1f5f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
  .app-container { background: #ffffff; max-width: 860px; width: 100%; border-radius: 18px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  
  header { text-align: center; margin-bottom: 16px; }
  header h1 { margin: 0 0 6px 0; font-size: 1.55rem; color: #0f172a; }
  header p { margin: 0; color: #64748b; font-size: 0.95rem; }

  /* Subject Selection Tabs */
  .subject-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .sub-btn { border: 2px solid #e2e8f0; background: #f8fafc; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; color: #475569; cursor: pointer; transition: 0.2s; text-align: center; }
  .sub-btn:hover { background: #ffffff; }
  .sub-btn.active[data-sub="math"] { background: #eff6ff; border-color: var(--math); color: var(--math); }
  .sub-btn.active[data-sub="science"] { background: #f0fdf4; border-color: var(--science); color: var(--science); }
  .sub-btn.active[data-sub="english"] { background: #faf5ff; border-color: var(--english); color: var(--english); }
  .sub-btn.active[data-sub="gk"] { background: #fff7ed; border-color: var(--gk); color: var(--gk); }
  .sub-btn.active[data-sub="reasoning"] { background: #eef2ff; border-color: var(--reasoning); color: var(--reasoning); }

  /* Progress Card */
  .progress-card { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.92rem; }
  .progress-card .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-weight: bold; }
  .progress-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s; }

  /* 1-100 Question Grid */
  .grid-container { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 18px; max-height: 140px; overflow-y: auto; padding: 8px; background: #f8fafc; border-radius: 10px; border: 1.5px solid #e2e8f0; }
  .q-btn { width: 33px; height: 33px; border-radius: 6px; border: 1.5px solid #cbd5e1; background: #ffffff; font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: 0.1s; }
  .q-btn.active { border-color: #0f172a; background: #0f172a; color: white; }
  .q-btn.correct { background: #16a34a !important; color: white !important; border-color: #15803d !important; }
  .q-btn.wrong { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }

  /* Question Area */
  .topic-tag { display: inline-block; padding: 4px 10px; border-radius: 15px; font-size: 0.8rem; font-weight: 700; margin-bottom: 10px; background: #e2e8f0; color: #334155; }
  .question-box { background: #f8fafc; border-radius: 12px; padding: 18px; min-height: 85px; font-size: 1.15rem; font-weight: 600; color: #1e293b; margin-bottom: 18px; line-height: 1.5; border-left: 5px solid #0f172a; }

  /* Options */
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  @media (max-width: 520px) { .options-grid { grid-template-columns: 1fr; } }
  .opt-btn { padding: 14px 16px; font-size: 1.05rem; font-weight: 600; border: 2px solid #cbd5e1; border-radius: 10px; background: white; cursor: pointer; text-align: left; transition: 0.15s; }
  .opt-btn:hover:not(:disabled) { border-color: #0f172a; background: #f8fafc; }
  .opt-btn.correct-opt { background: #16a34a !important; color: white !important; border-color: #15803d !important; }
  .opt-btn.wrong-opt { background: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }

  /* Feedback */
  .feedback-box { padding: 14px 18px; border-radius: 10px; font-size: 0.96rem; margin-bottom: 18px; display: none; line-height: 1.5; }
  .feedback-box.show { display: block; }

  /* Navigation & Controls */
  .nav-buttons { display: flex; justify-content: space-between; gap: 10px; }
  .nav-btn { padding: 10px 22px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; background: #0f172a; color: white; transition: 0.15s; }
  .nav-btn:disabled { background: #94a3b8; cursor: not-allowed; }

  .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
  .score-badge { font-size: 1.05rem; font-weight: bold; color: #0f172a; }
  .btn-small { border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.88rem; }
  .btn-reset { background: #ef4444; color: white; }
  .btn-clear-all { background: #64748b; color: white; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>🏆 Class 1 Olympiad Master (Set B - 500 Fresh Questions) 🏆</h1>
    <p>100 Brand New Questions in Each Subject • No Repetitions</p>
  </header>

  <div class="subject-tabs">

    <button class="sub-btn" data-sub="english" onclick="switchSubject('english')">📖 English (100)</button>
    <button class="sub-btn" data-sub="gk" onclick="switchSubject('gk')">🌍 GK (100)</button>
    <button class="sub-btn" data-sub="reasoning" onclick="switchSubject('reasoning')">🧠 Reasoning (100)</button>
  </div>

  <div class="progress-card">
    <div class="top-row">
      <span id="subjectName">Maths</span>
      <span id="subjectScoreText">Score: 0 / 100</span>
    </div>
    <div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:0.85rem; color:#475569;">
      <span>Overall Portal Progress</span>
      <span id="overallPercentage">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="overallBar"></div>
    </div>
  </div>

  <!-- 1-100 Number Palette -->
  <div class="grid-container" id="navGrid"></div>

  <div><span class="topic-tag" id="topicBadge">Topic</span></div>
  <div class="question-box" id="questionText">Loading...</div>
  <div class="options-grid" id="optionsContainer"></div>
  <div class="feedback-box" id="feedback"></div>

  <div class="nav-buttons">
    <button class="nav-btn" id="prevBtn" onclick="prevQ()">⬅ Previous</button>
    <button class="nav-btn" id="nextBtn" onclick="nextQ()">Next ➡</button>
  </div>

  <div class="footer-bar">
    <div class="score-badge" id="footerScore">Score: 0 / 100</div>
    <div>
      <button class="btn-small btn-reset" onclick="resetCurrentSubject()">🔄 Reset Subject</button>
      <button class="btn-small btn-clear-all" onclick="resetAllData()">⚠️ Reset All 500</button>
    </div>
  </div>
</div>

const masterData = {
  math: Q_MATH,
  science: Q_SCIENCE,
  english: Q_ENGLISH,
  gk: Q_GK,
  reasoning: Q_REASONING
};

const subjectDisplayNames = {
  math: "📐 Mathematics",
  science: "🔬 Science",
  english: "📖 English",
  gk: "🌍 General Knowledge",
  reasoning: "🧠 Logical Reasoning"
};

let currentSubject = 'math';
let currentQuestionIndex = 0;
let userState = {};

function initStorage() {
  const saved = localStorage.getItem('class2_olympiad_500_fresh_state');
  if (saved) {
    try { userState = JSON.parse(saved); } catch(e) { userState = {}; }
  }
  Object.keys(masterData).forEach(sub => {
    if (!userState[sub] || userState[sub].length !== 100) {
      userState[sub] = new Array(100).fill(null);
    }
  });
}

function saveState() {
  localStorage.setItem('class2_olympiad_500_fresh_state', JSON.stringify(userState));
}

function switchSubject(sub) {
  currentSubject = sub;
  currentQuestionIndex = 0;
  
  document.querySelectorAll('.sub-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-sub') === sub);
  });
  
  document.getElementById('subjectName').innerText = subjectDisplayNames[sub];
  loadQuestion();
}

function renderGrid() {
  const grid = document.getElementById('navGrid');
  grid.innerHTML = '';
  const currentList = masterData[currentSubject];
  const userAnswers = userState[currentSubject];

  currentList.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'q-btn' + (idx === currentQuestionIndex ? ' active' : '');
    const ans = userAnswers[idx];
    if (ans) {
      btn.classList.add(ans === item[3] ? 'correct' : 'wrong');
    }
    btn.innerText = idx + 1;
    btn.onclick = () => { currentQuestionIndex = idx; loadQuestion(); };
    grid.appendChild(btn);
  });
}

function loadQuestion() {
  renderGrid();
  const qData = masterData[currentSubject][currentQuestionIndex];
  const answered = userState[currentSubject][currentQuestionIndex];

  document.getElementById('topicBadge').innerText = "📌 " + qData[0];
  document.getElementById('questionText').innerText = `${currentQuestionIndex + 1}. ${qData[1]}`;
  
  document.getElementById('prevBtn').disabled = (currentQuestionIndex === 0);
  document.getElementById('nextBtn').disabled = (currentQuestionIndex === masterData[currentSubject].length - 1);

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  qData[2].forEach(option => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = option;
    btn.onclick = () => selectAnswer(option);

    if (answered) {
      btn.disabled = true;
      if (option === qData[3]) btn.classList.add('correct-opt');
      if (option === answered && answered !== qData[3]) btn.classList.add('wrong-opt');
    }
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  if (answered) {
    fb.className = 'feedback-box show';
    const isRight = (answered === qData[3]);
    fb.style.background = isRight ? '#dcfce7' : '#fee2e2';
    fb.style.color = isRight ? '#15803d' : '#b91c1c';
    fb.innerHTML = (isRight ? '✔ <b>शाबाश! सही उत्तर।</b> ' : `✖ <b>गलत उत्तर!</b> (सही उत्तर: <b>${qData[3]}</b>)<br>`) + `<b>हल / व्याख्या:</b> ${qData[4]}`;
  } else {
    fb.className = 'feedback-box';
  }

  updateMetrics();
}

function selectAnswer(selected) {
  if (userState[currentSubject][currentQuestionIndex]) return;
  userState[currentSubject][currentQuestionIndex] = selected;
  saveState();
  loadQuestion();
}

function updateMetrics() {
  const currentAnswers = userState[currentSubject];
  const currentList = masterData[currentSubject];
  
  let currentScore = 0;
  let currentAttempted = 0;
  currentAnswers.forEach((ans, i) => {
    if (ans) currentAttempted++;
    if (ans === currentList[i][3]) currentScore++;
  });

  const scoreText = `Score: ${currentScore} / 100 (हल: ${currentAttempted}/100)`;
  document.getElementById('subjectScoreText').innerText = scoreText;
  document.getElementById('footerScore').innerText = `Score: ${currentScore} / 100`;

  let totalQuestions = 500;
  let totalAttempted = 0;
  Object.keys(masterData).forEach(sub => {
    userState[sub].forEach(a => { if (a) totalAttempted++; });
  });

  const percent = Math.round((totalAttempted / totalQuestions) * 100);
  document.getElementById('overallPercentage').innerText = `${percent}% (${totalAttempted}/500)`;
  document.getElementById('overallBar').style.width = `${percent}%`;
}

function nextQ() {
  if (currentQuestionIndex < masterData[currentSubject].length - 1) {
    currentQuestionIndex++;
    loadQuestion();
  }
}

function prevQ() {
  if (currentQuestionIndex > 0) {
    currentQuestionIndex--;
    loadQuestion();
  }
}

function resetCurrentSubject() {
  if (confirm(`क्या आप ${subjectDisplayNames[currentSubject]} के सभी 100 उत्तर मिटाकर रीसेट करना चाहते हैं?`)) {
    userState[currentSubject] = new Array(100).fill(null);
    currentQuestionIndex = 0;
    saveState();
    loadQuestion();
  }
}

function resetAllData() {
  if (confirm("चेतावनी: क्या आप सभी 5 विषयों का डेटा (कुल 500 प्रश्न) मिटाकर शून्य से शुरू करना चाहते हैं?")) {
    localStorage.removeItem('class2_olympiad_500_fresh_state');
    initStorage();
    currentQuestionIndex = 0;
    loadQuestion();
  }
}

initStorage();
switchSubject('math');
</script>
